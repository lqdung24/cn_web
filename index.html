<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mục lục bài tập Web</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #172b42;
      background: #f3f6fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(100% - 40px, 880px);
      margin: 80px auto;
    }
    header { margin-bottom: 36px; }
    .eyebrow {
      margin: 0 0 16px;
      color: #315fb4;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.2;
      letter-spacing: -1px;
    }
    .intro { margin: 0; color: #52647a; line-height: 1.7; }
    .lessons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .lesson {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 28px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      border: 1px solid #dce4ef;
      border-radius: 18px;
      box-shadow: 0 6px 24px #172b4206;
      transition: border-color .2s, box-shadow .2s;
    }
    .lesson:hover {
      border-color: #315fb4;
      box-shadow: 0 10px 28px #172b4210;
    }
    .lesson:focus-visible {
      outline: 3px solid #315fb4;
      outline-offset: 5px;
    }
    .lesson-number {
      align-self: flex-start;
      margin-bottom: 24px;
      padding: 8px 12px;
      color: #315fb4;
      background: #edf3ff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    .description { margin: 0 0 28px; color: #52647a; line-height: 1.7; }
    .open {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid #e8edf4;
      color: #315fb4;
      font-size: 15px;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      main { margin: 40px auto; }
      .lessons { grid-template-columns: 1fr; }
      .lesson { padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lesson { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Bài tập lập trình Web</p>
      <h1>Mục lục bài tập</h1>
      <p class="intro">Chọn một bài bên dưới để xem nội dung.</p>
    </header>
    <nav aria-label="Danh sách bài tập">
      <ol class="lessons">
        <li>
          <a class="lesson" href="./b1/index.html">
            <span class="lesson-number">Bài 1</span>
            <h2>Quick Notes</h2>
            <p class="description">Ứng dụng ghi chú: thêm, lưu và quản lý ghi chú của bạn.</p>
            <span class="open">Mở bài tập <span aria-hidden="true">→</span></span>
          </a>
        </li>
        <li>
          <a class="lesson" href="./baitapHTML/index.html">
            <span class="lesson-number">Bài 2</span>
            <h2>Bài tập HTML</h2>
            <p class="description">Website gồm các trang Home, About, News và Blog.</p>
            <span class="open">Mở bài tập <span aria-hidden="true">→</span></span>
          </a>
        </li>
      </ol>
    </nav>
  </main>
</body>
</html>
