<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Notes</title>
<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#222; --muted:#777; --border:#ddd; --btn:#222; --btnText:#fff;
}
body.dark{
  --bg:#181818; --card:#242424; --text:#f5f5f5; --muted:#aaa; --border:#444; --btn:#eee; --btnText:#222;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.25s}
.container{width:90%;max-width:900px;margin:40px auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
h1{margin:0;font-size:28px}
.header-buttons{display:flex;gap:10px}
button{border:0;cursor:pointer;padding:10px 16px;border-radius:8px;background:var(--btn);color:var(--btnText);font-size:14px}
button:hover{opacity:.85}
.note-form{display:none;background:var(--card);padding:20px;margin-bottom:25px;border-radius:10px;border:1px solid var(--border)}
.note-form.active{display:block}
input,textarea{width:100%;padding:12px;margin-bottom:12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
textarea{min-height:120px;resize:vertical}
.notes-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.note-card{background:var(--card);padding:18px;border-radius:10px;border:1px solid var(--border)}
.note-card h3{margin-top:0;margin-bottom:10px}
.note-card p{color:var(--muted);white-space:pre-wrap;word-break:break-word}
.note-date{display:block;font-size:12px;color:var(--muted);margin-top:15px}
.delete-btn{margin-top:15px;background:#d9534f;color:#fff}
.empty-message{text-align:center;color:var(--muted);padding:40px}
@media(max-width:600px){
  header{align-items:flex-start;gap:15px}
  .header-buttons{flex-direction:column}
  .notes-container{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Quick Notes</h1>
    <div class="header-buttons">
      <button id="themeBtn">🌙 Dark</button>
      <button id="addNoteBtn">+ Thêm ghi chú</button>
    </div>
  </header>

  <div class="note-form" id="noteForm">
    <input type="text" id="noteTitle" placeholder="Tiêu đề...">
    <textarea id="noteContent" placeholder="Nội dung ghi chú..."></textarea>
    <button id="saveNoteBtn">Lưu ghi chú</button>
  </div>

  <div class="notes-container" id="notesContainer"></div>
</div>

<script>
const addNoteBtn=document.getElementById("addNoteBtn");
const noteForm=document.getElementById("noteForm");
const noteTitle=document.getElementById("noteTitle");
const noteContent=document.getElementById("noteContent");
const saveNoteBtn=document.getElementById("saveNoteBtn");
const notesContainer=document.getElementById("notesContainer");
const themeBtn=document.getElementById("themeBtn");

let notes=JSON.parse(localStorage.getItem("notes"))||[];

addNoteBtn.addEventListener("click",()=>{
  noteForm.classList.toggle("active");
  if(noteForm.classList.contains("active")) noteTitle.focus();
});

saveNoteBtn.addEventListener("click",()=>{
  const title=noteTitle.value.trim();
  const content=noteContent.value.trim();
  if(title==="" && content===""){alert("Vui lòng nhập nội dung ghi chú!");return;}

  notes.unshift({
    id:Date.now(),
    title:title||"Không có tiêu đề",
    content,
    createdAt:new Date().toLocaleString("vi-VN")
  });

  saveNotes();
  renderNotes();
  noteTitle.value="";
  noteContent.value="";
  noteForm.classList.remove("active");
});

function saveNotes(){
  localStorage.setItem("notes",JSON.stringify(notes));
}

function escapeHTML(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

function deleteNote(id){
  if(!confirm("Bạn có chắc muốn xóa ghi chú này?")) return;
  notes=notes.filter(n=>n.id!==id);
  saveNotes();
  renderNotes();
}

function renderNotes(){
  notesContainer.innerHTML="";
  if(notes.length===0){
    notesContainer.innerHTML='<div class="empty-message">Chưa có ghi chú nào.</div>';
    return;
  }

  notes.forEach(note=>{
    const card=document.createElement("div");
    card.className="note-card";
    card.innerHTML=`
      <h3>${escapeHTML(note.title)}</h3>
      <p>${escapeHTML(note.content)}</p>
      <span class="note-date">${note.createdAt}</span>
      <button class="delete-btn" onclick="deleteNote(${note.id})">Xóa</button>
    `;
    notesContainer.appendChild(card);
  });
}

if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark");
  themeBtn.textContent="☀️ Light";
}

themeBtn.addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  const isDark=document.body.classList.contains("dark");
  themeBtn.textContent=isDark?"☀️ Light":"🌙 Dark";
  localStorage.setItem("theme",isDark?"dark":"light");
});

renderNotes();
</script>
</body>
</html>
